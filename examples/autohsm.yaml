# Install root:autohsm with mode 0640. The daemon also accepts owner-only 0600.

# Operator-assigned context label bound into every wrapped share. It prevents
# accidental cross-node use but is not hardware identity; use a unique HSM key
# per node for actual separation. Changing it requires re-wrapping the shares.
node_id: node-a

vault:
  # Must be https. There is no plaintext option: shares cross the network.
  address: https://vault-a.example.com:8200
  # The CA (or self-signed leaf) that signs Vault's certificate. Required —
  # there is deliberately no fallback to the system trust store.
  ca_cert_path: /etc/autohsm/vault-ca.pem
  timeout: 10s
  # Set false only for a Vault that cannot negotiate TLS 1.3.
  require_tls13: true

keys:
  source: pkcs11

  pkcs11:
    module_path: /usr/lib/softhsm/libsofthsm2.so
    token_label: autohsm          # optional; first token used if omitted
    key_label: autohsm-wrap       # non-extractable AES-256 key on the token
    # Exactly one external PIN source. The systemd deployment uses a root-owned,
    # autohsm-readable file; inline PINs are deliberately unsupported.
    pin_file: /etc/autohsm/pin  # root:autohsm, mode 0640
    # pin_env: AUTOHSM_PIN      # useful for interactive provisioning only

  # Shares THIS node holds. Keep this list shorter than Vault's unseal
  # threshold: if one node can reach threshold alone, compromising that node
  # is equivalent to holding every key, and the design buys you nothing.
  shares:
    - index: 1
      path: /etc/autohsm/share-1.wrapped

watch:
  interval: 30s
  # Stop after this many consecutive unseal rejections rather than hammering
  # Vault — usually means the shares are stale (Vault was re-initialised).
  max_unseal_attempts: 5

alarm:
  # Optional. Must be https. Fires whenever a sealed Vault is observed, even if
  # the unseal then succeeds — so you learn Vault restarted.
  # webhook_url: https://alerts.example.com/hooks/vault-sealed
